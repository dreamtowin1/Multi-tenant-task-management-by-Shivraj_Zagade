spring.application.name=multi-tenant-task-management

spring.datasource.url=jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# 256-bit+ Base64-encoded secret for HS256 signing (override via JWT_SECRET env var in production)
jwt.secret=${JWT_SECRET:VGVjaFB1bHNlSVQtTXVsdGlUZW5hbnRUYXNrTWFuYWdlbWVudFNlY3JldEtleTIwMjYh}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
